name: Import Dead Signal Native Work Baselines (No Publish)

on:
  push:
    branches: [main]
    paths:
      - 'games/dead-signal/imports/DeadSignal-v1.8.0-Full-Baselines-Import.zip'

permissions:
  contents: write

jobs:
  create-reviewed-import-branch:
    if: github.repository == 'stephennip9288-create/Roblox-Projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout user-uploaded source ZIP
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exact archive and extract immutable original Work files
        run: python scripts/import_dead_signal_native_baselines.py
      - name: Commit extracted baselines ONLY to a new review branch
        shell: bash
        run: |
          set -euo pipefail
          branch="feature/dead-signal-v1.8.0-full-native-baselines"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error::Import branch already exists; refusing to overwrite"
            exit 1
          fi
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/dead-signal/full-baselines/v1.8.0/
          git rm -- games/dead-signal/imports/DeadSignal-v1.8.0-Full-Baselines-Import.zip
          python - <<'PY'
          import subprocess
          names=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          root='games/dead-signal/full-baselines/v1.8.0/'
          expected={root+x for x in ('dispatch.rbxl','blackwater.rbxl','cinderworks.rbxl','whiteout.rbxl','IMPORT-MANIFEST.json','README.md')}
          expected.add('games/dead-signal/imports/DeadSignal-v1.8.0-Full-Baselines-Import.zip')
          assert names==expected, f'Unexpected change paths: {names ^ expected}'
          print('Exact safe diff validated: 6 additions and temporary ZIP deletion.')
          PY
          git commit -m "Import four immutable Work v1.8 native place baselines for review"
          git push --no-verify origin "HEAD:refs/heads/$branch"
          echo "::notice title=Baseline review branch created::Open a PR from $branch to main. NO ROBLOX FILES PUBLISHED."

# This workflow cannot publish Roblox: it has no Roblox secret, Open Cloud endpoint,
# or publish command. It does not directly modify main after the ZIP upload.
