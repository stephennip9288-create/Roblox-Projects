name: Dead Signal Production Candidate Readiness (No Publish)

on:
  push:
    paths:
      - 'scripts/dead_signal_release_guard.py'
      - 'scripts/dead_signal_production_admission.py'
      - 'scripts/dead_signal_batch2_candidate.py'
      - 'tests/test_dead_signal_batch2_candidate.py'
      - 'scripts/dead_signal_postrelease_recovery.py'
      - 'tests/test_dead_signal_production_admission.py'
      - 'tests/test_dead_signal_postrelease_recovery.py'
      - 'games/dead-signal/releases/**'
      - 'tests/test_dead_signal_release_guard.py'
      - 'games/dead-signal/dev/Source/**'
      - 'scripts/patch_dead_signal_rbxl.py'
      - 'scripts/check_dead_signal_production.py'
      - 'scripts/dead_signal_production_rollout.py'
      - 'tests/test_dead_signal_production_rollout.py'
      - '.github/workflows/dead-signal-production-release.yml'
      - 'games/dead-signal/full-baselines/**'
      - '.github/workflows/dead-signal-production-readiness.yml'
  pull_request:
    paths:
      - 'scripts/dead_signal_release_guard.py'
      - 'scripts/dead_signal_production_admission.py'
      - 'scripts/dead_signal_batch2_candidate.py'
      - 'tests/test_dead_signal_batch2_candidate.py'
      - 'tests/test_dead_signal_production_admission.py'
      - 'games/dead-signal/releases/**'
      - 'tests/test_dead_signal_release_guard.py'
      - 'games/dead-signal/dev/Source/**'
      - 'scripts/patch_dead_signal_rbxl.py'
      - 'scripts/check_dead_signal_production.py'
      - 'scripts/dead_signal_production_rollout.py'
      - 'tests/test_dead_signal_production_rollout.py'
      - '.github/workflows/dead-signal-production-release.yml'
      - 'games/dead-signal/full-baselines/**'
      - '.github/workflows/dead-signal-production-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-ready:
    name: Offline source-to-production parity (no publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run publisher and production safety tests
        run: |
          python -m unittest discover -s tests -v
          if [ -f games/dead-signal/dev/Tests/test_audio_supplement_intake.py ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes ffmpeg
            python -m unittest discover -s games/dead-signal/dev/Tests -v
          else
            echo "Historical control-only source has no Python audio intake tests; the pinned production candidate must run them."
          fi
          python scripts/validate.py
      - name: Generate two sets of isolated teleport destinations
        run: python scripts/generate_dead_signal_place_configs.py
      - name: Download and verify current production recovery without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dead_signal_release_guard.py recovery --environment production --operation deploy
      - name: Install Lune 0.11.0
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          path: games/dead-signal/dev
      - name: Run real Work source regressions against native v1.8 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p games/dead-signal/dev/Places
          cp games/dead-signal/full-baselines/v1.8.0/dispatch.rbxl games/dead-signal/dev/Places/DeadSignal-v1.8.0-Lobby.rbxl
          cp games/dead-signal/full-baselines/v1.8.0/blackwater.rbxl games/dead-signal/dev/Places/DeadSignal-v1.8.0-Station.rbxl
          cp games/dead-signal/full-baselines/v1.8.0/cinderworks.rbxl games/dead-signal/dev/Places/DeadSignal-v1.8.0-Foundry.rbxl
          cp games/dead-signal/full-baselines/v1.8.0/whiteout.rbxl games/dead-signal/dev/Places/DeadSignal-v1.8.0-Frost.rbxl
          cd games/dead-signal/dev
          lune run Tests/syntax.luau
          python Tests/run.py --lune lune
      - name: Build four staging candidates for exact source comparison
        run: python scripts/patch_dead_signal_rbxl.py --environment staging
      - name: Build four production candidates without changing existing production files
        run: python scripts/patch_dead_signal_rbxl.py --environment production
      - name: Independently verify raw world/asset preservation in both environments
        run: |
          python scripts/audit_dead_signal_binary.py --candidate-dir build/dead-signal-lossless/staging --baseline-dir games/dead-signal/full-baselines/v1.8.0
          python scripts/audit_dead_signal_binary.py --candidate-dir build/dead-signal-lossless/production --baseline-dir games/dead-signal/full-baselines/v1.8.0
      - name: Verify production teleport IDs, source equivalence, and committed rollback binaries
        run: python scripts/check_dead_signal_production.py
      - name: Verify reviewed production admission and eight pinned builds without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import dead_signal_production_admission as admission
          records = Path('games/dead-signal/releases')
          path = records / admission.RECORD
          if path.is_file():
              record = json.loads(path.read_text())
              if record.get('ready_for_production') is True:
                  recovery = json.loads((records / 'recovery-production.json').read_text())
                  permissions = json.loads((records / 'batch-1-production-audio-permissions.json').read_text())
                  # A new *owner-published* recovery must not replace the previous
                  # rollback used to authorize the original production deploy.
                  if (recovery.get('source_sha') == record['rollback']['source_sha']
                          and recovery.get('deployment') == record['rollback']['deployment']):
                      admission.completion(record, record['source_sha'], recovery, permissions)
                      print('Prepublication admission and original reviewed rollback verified')
                  else:
                      import dead_signal_postrelease_recovery as postrelease
                      historical = json.loads((records / 'history/production-41800682585-previous.json').read_text())
                      acceptance = json.loads((records / 'history/production-41800682585-acceptance.json').read_text())
                      postrelease.completion(record, historical, recovery, permissions, acceptance)
                      print('Owner-accepted published recovery and original known-good archive verified; no deploy admitted')
                  admission.verify_ci(record, os.environ['GH_TOKEN'])
                  batch2_review = Path('games/dead-signal/dev/Reviews/batch2-integration/REVIEWED-RUNTIME.json')
                  if batch2_review.is_file():
                      import dead_signal_batch2_candidate as batch2
                      batch2.verify_historical_builds(record)
                      batch2.verify_builds()
                      print('Original Batch 1 eight-build hashes reproduced exactly; separate reviewed Batch 2 eight-build hashes verified; no deploy admitted')
                  else:
                      admission.verify_builds(record)
                      print('Historical source CI and eight built hashes verified; no publishing')
              else:
                  print('Production admission remains not ready; no publication is permitted')
          else:
              print('Historical source has no Batch 1 production admission; no publishing')
          PY
      - name: Archive production candidate and safety reports for review only
        uses: actions/upload-artifact@v7
        with:
          name: dead-signal-production-preview-${{ github.run_number }}
          path: |
            build/dead-signal-lossless/production/
            build/dead-signal-lossless/staging/LOSSLESS-REPORT.json
          retention-days: 14
          if-no-files-found: error

# No ROBLOX_PRODUCTION_API_KEY and no publish command in this workflow.
