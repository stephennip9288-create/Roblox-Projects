name: Dead Signal Controlled Private Staging

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "deploy = complete reviewed Batch 1; rollback = exact recorded staging release"
        type: choice
        options: [deploy, rollback]
        required: true
        default: rollback
      confirmation:
        description: "Type DEPLOY-PRIVATE-STAGING or RESTORE-PRIVATE-STAGING"
        type: string
        required: true
      source_sha:
        description: "Deploy: reviewed full 40-character Batch 1 integration SHA; rollback: leave blank"
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: dead-signal-private-staging-four-places
  cancel-in-progress: false

jobs:
  controlled-staging:
    if: github.repository == 'stephennip9288-create/Roblox-Projects' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: candidate
    env:
      PYTHONPATH: ''
    steps:
      - name: Check out reviewed main controls
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: release-control
          persist-credentials: false
      - name: Validate immutable staging source
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$OPERATION" = "deploy" ]; then
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          elif [ "$OPERATION" = "rollback" ]; then
            [ -z "$SOURCE_SHA" ] || exit 1
          else
            exit 1
          fi
      - name: Check out exact selected source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve explicitly authorized four-place staging operation
        id: intent
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REQUESTED_OPERATION" = "deploy" ] && [ "$REQUESTED_CONFIRMATION" = "DEPLOY-PRIVATE-STAGING" ]; then
              echo 'operation=deploy' >> "$GITHUB_OUTPUT"
              echo 'confirmation=DEPLOY-PRIVATE-STAGING' >> "$GITHUB_OUTPUT"
            elif [ "$REQUESTED_OPERATION" = "rollback" ] && [ "$REQUESTED_CONFIRMATION" = "RESTORE-PRIVATE-STAGING" ]; then
              echo 'operation=rollback' >> "$GITHUB_OUTPUT"
              echo 'confirmation=RESTORE-PRIVATE-STAGING' >> "$GITHUB_OUTPUT"
            else
              echo "::error::Invalid manual operation or confirmation" >&2
              exit 1
            fi
          else
            echo "::error::Unknown event" >&2
            exit 1
          fi
      - name: Install trusted controls and enforce complete Batch 1
        working-directory: ${{ github.workspace }}
        env:
          OPERATION: ${{ inputs.operation }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python release-control/scripts/dead_signal_release_guard.py controls --control release-control --candidate candidate --operation "$OPERATION" --source-sha "$SOURCE_SHA" --environment staging
      - name: Fetch and verify the recorded current staging recovery set
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
        run: python scripts/dead_signal_release_guard.py recovery --environment staging --operation "$OPERATION"
      - name: Validate GitHub project and staging-only configuration
        if: ${{ steps.intent.outputs.operation == 'deploy' }}
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate.py
          python scripts/generate_dead_signal_place_configs.py
      - name: Install pinned Lune for candidate tests
        if: ${{ steps.intent.outputs.operation == 'deploy' }}
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          path: candidate/games/dead-signal/dev
      - name: Verify complete native Work code suite
        if: ${{ steps.intent.outputs.operation == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p games/dead-signal/dev/Places
          cp games/dead-signal/full-baselines/v1.8.0/dispatch.rbxl games/dead-signal/dev/Places/DeadSignal-v1.8.0-Lobby.rbxl
          cp games/dead-signal/full-baselines/v1.8.0/blackwater.rbxl games/dead-signal/dev/Places/DeadSignal-v1.8.0-Station.rbxl
          cp games/dead-signal/full-baselines/v1.8.0/cinderworks.rbxl games/dead-signal/dev/Places/DeadSignal-v1.8.0-Foundry.rbxl
          cp games/dead-signal/full-baselines/v1.8.0/whiteout.rbxl games/dead-signal/dev/Places/DeadSignal-v1.8.0-Frost.rbxl
          cd games/dead-signal/dev
          lune run Tests/syntax.luau
          python Tests/run.py --lune lune
      - name: Generate four lossless staging candidates
        if: ${{ steps.intent.outputs.operation == 'deploy' }}
        run: python scripts/patch_dead_signal_rbxl.py
      - name: Independently audit untouched Roblox binary properties
        if: ${{ steps.intent.outputs.operation == 'deploy' }}
        run: python scripts/audit_dead_signal_binary.py --candidate-dir build/dead-signal-lossless/staging --baseline-dir games/dead-signal/full-baselines/v1.8.0
      - name: Reinstall trusted controls after candidate tests
        working-directory: ${{ github.workspace }}
        env:
          OPERATION: ${{ inputs.operation }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python release-control/scripts/dead_signal_release_guard.py controls --control release-control --candidate candidate --operation "$OPERATION" --source-sha "$SOURCE_SHA" --environment staging
      - name: Preflight all four candidates and all four rollback binaries
        env:
          OPERATION: ${{ steps.intent.outputs.operation }}
        run: |
          python - <<'PY'
          import os,sys
          sys.path.insert(0,'scripts')
          from dead_signal_staging_rollout import preflight, current_baselines, write_backup_manifest
          items=preflight(current=True) if os.environ['OPERATION']=='deploy' else current_baselines()
          write_backup_manifest(items)
          assert len(items)==4
          print('STAGING PRE-FLIGHT PASSED for',os.environ['OPERATION'])
          PY
      - name: Save pre-deployment staging rollback manifest
        uses: actions/upload-artifact@v7
        with:
          name: dead-signal-staging-rollback-manifest-${{ github.run_id }}
          path: candidate/build/dead-signal-staging-rollout/ROLLBACK-MANIFEST.json
          retention-days: 90
          if-no-files-found: error
      - name: Retain the exact reviewed candidate for future recovery
        if: ${{ steps.intent.outputs.operation == 'deploy' }}
        uses: actions/upload-artifact@v7
        with:
          name: dead-signal-complete-batch1-staging-${{ github.run_id }}
          path: |
            candidate/build/dead-signal-lossless/staging/
            candidate/games/dead-signal/releases/batch-1.json
          retention-days: 90
          if-no-files-found: error
      - name: Upload private staging place files only
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          OPERATION: ${{ steps.intent.outputs.operation }}
          CONFIRMATION: ${{ steps.intent.outputs.confirmation }}
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_STAGING_API_KEY }}
        run: python scripts/dead_signal_staging_rollout.py --operation "$OPERATION" --confirmation "$CONFIRMATION"
      - name: Save deployment result or rollback failure details
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dead-signal-staging-deployment-result-${{ github.run_id }}
          path: |
            candidate/build/dead-signal-staging-rollout/ROLLBACK-MANIFEST.json
            candidate/build/dead-signal-staging-rollout/PUBLISH-RESULT.json
          retention-days: 90
          if-no-files-found: warn

# Staging uses its scoped key and universe; production is never a staging target.
