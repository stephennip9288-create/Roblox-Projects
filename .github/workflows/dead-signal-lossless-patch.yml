name: Dead Signal Lossless Source Patch (No Publish)

on:
  push:
    paths:
      - 'scripts/dead_signal_release_guard.py'
      - 'scripts/dead_signal_production_admission.py'
      - 'tests/test_dead_signal_production_admission.py'
      - 'games/dead-signal/releases/**'
      - 'tests/test_dead_signal_release_guard.py'
      - 'games/dead-signal/dev/Source/**'
      - 'scripts/patch_dead_signal_rbxl.py'
      - 'games/dead-signal/full-baselines/**'
      - 'tests/test_patch_dead_signal_rbxl.py'
      - 'scripts/audit_dead_signal_binary.py'
      - 'scripts/generate_dead_signal_place_configs.py'
      - '.github/workflows/dead-signal-lossless-patch.yml'
  pull_request:
    paths:
      - 'scripts/dead_signal_release_guard.py'
      - 'scripts/dead_signal_production_admission.py'
      - 'tests/test_dead_signal_production_admission.py'
      - 'games/dead-signal/releases/**'
      - 'tests/test_dead_signal_release_guard.py'
      - 'games/dead-signal/dev/Source/**'
      - 'scripts/patch_dead_signal_rbxl.py'
      - 'games/dead-signal/full-baselines/**'
      - 'tests/test_patch_dead_signal_rbxl.py'
      - 'scripts/audit_dead_signal_binary.py'
      - 'scripts/generate_dead_signal_place_configs.py'
      - '.github/workflows/dead-signal-lossless-patch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-source-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout known-good complete staging places and editable source
        uses: actions/checkout@v5
      - name: Python setup
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate manifests and established source tests
        run: |
          python -m unittest discover -s tests -v
          if [ -f games/dead-signal/dev/Tests/test_audio_supplement_intake.py ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes ffmpeg
            python -m unittest discover -s games/dead-signal/dev/Tests -v
          else
            echo "Historical control-only source has no Python audio intake tests; the pinned production candidate must run them."
          fi
          python scripts/validate.py
      - name: Check native v1.8 Work binary baselines are imported
        id: baseline
        shell: bash
        run: |
          if [ ! -f games/dead-signal/full-baselines/v1.8.0/IMPORT-MANIFEST.json ]; then
            echo "::error title=Native baselines required::Missing verified v1.8.0 native Work place import. Integration cannot be skipped."
            exit 1
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Install pinned Lune for native v1.8 compatibility tests
        if: ${{ steps.baseline.outputs.ready == 'true' }}
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          path: games/dead-signal/dev
      - name: Run source regressions against original native Work v1.8 place fixtures
        if: ${{ steps.baseline.outputs.ready == 'true' }}
        shell: bash
        run: |
          mkdir -p games/dead-signal/dev/Places
          cp games/dead-signal/full-baselines/v1.8.0/dispatch.rbxl games/dead-signal/dev/Places/DeadSignal-v1.8.0-Lobby.rbxl
          cp games/dead-signal/full-baselines/v1.8.0/blackwater.rbxl games/dead-signal/dev/Places/DeadSignal-v1.8.0-Station.rbxl
          cp games/dead-signal/full-baselines/v1.8.0/cinderworks.rbxl games/dead-signal/dev/Places/DeadSignal-v1.8.0-Foundry.rbxl
          cp games/dead-signal/full-baselines/v1.8.0/whiteout.rbxl games/dead-signal/dev/Places/DeadSignal-v1.8.0-Frost.rbxl
          cd games/dead-signal/dev
          lune run Tests/syntax.luau
          python Tests/run.py --lune lune
      - name: Patch ONLY Script Source PROP chunks (no full-place serialization)
        if: ${{ steps.baseline.outputs.ready == 'true' }}
        run: python scripts/patch_dead_signal_rbxl.py
      - name: Verify raw RBXL class/property fidelity
        if: ${{ steps.baseline.outputs.ready == 'true' }}
        run: python scripts/audit_dead_signal_binary.py --candidate-dir build/dead-signal-lossless/staging --baseline-dir games/dead-signal/full-baselines/v1.8.0
      - name: Verify patch reports and no unexpected output files
        if: ${{ steps.baseline.outputs.ready == 'true' }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          d=Path('build/dead-signal-lossless/staging')
          report=json.loads((d/'LOSSLESS-REPORT.json').read_text())
          expected={'dispatch','blackwater','cinderworks','whiteout'}
          assert set(report)==expected
          assert {p.name for p in d.iterdir() if p.is_file()} == {f'{p}.rbxl' for p in expected}|{'LOSSLESS-REPORT.json','BINARY-FIDELITY-REPORT.json'}
          for name in expected:
              r=report[name]
              assert r['all_untouched_chunks_byte_identical']
              assert r['expected_replacement_count']>=60
              assert not r['publish_approved'] and not r['studio_tested']
              assert (d/f'{name}.rbxl').stat().st_size>100_000
          print('Four binary source-only patch reports verified; no publish.')
          PY
      - name: Upload offline-patched staging candidates (REVIEW ONLY)
        if: ${{ steps.baseline.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: dead-signal-lossless-staging-${{ github.run_number }}
          path: build/dead-signal-lossless/staging/
          retention-days: 14
          if-no-files-found: error

# No secrets, Roblox endpoints, scripts/publish.py, or write permissions used.
